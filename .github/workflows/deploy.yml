name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job escalates per job.
permissions:
  contents: read

concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (see .github/dependabot.yml for updates).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1' # CVE-2026-111497 is unfixed on Node 20 (EOL)
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /thedivinehima
      # ponytail: preview-only. basePath doesn't reach plain <img src="/wp-content/..."> paths,
      # so prefix them in the export (HTML, RSC payloads, JS). Drop this step and BASE_PATH
      # when deploying to thedivinehima.com.
      - run: grep -rl --include='*.html' --include='*.txt' --include='*.js' '"/wp-content/' out | xargs sed -i 's#"/wp-content/#"/thedivinehima/wp-content/#g'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    # Builds on PRs are verification only; only main deploys.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
