name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /thedivinehima
      # ponytail: preview-only. basePath doesn't reach plain <img src="/wp-content/..."> paths,
      # so prefix them in the export (HTML, RSC payloads, JS). Drop this step and BASE_PATH
      # when deploying to thedivinehima.com.
      - run: grep -rl --include='*.html' --include='*.txt' --include='*.js' '"/wp-content/' out | xargs sed -i 's#"/wp-content/#"/thedivinehima/wp-content/#g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
